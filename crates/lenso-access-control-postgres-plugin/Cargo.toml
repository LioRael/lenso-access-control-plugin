[package]
name = "lenso-access-control-postgres-plugin"
version = "0.2.1"
description = "PostgreSQL-backed independent RBAC Plugin for Lenso applications."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.access-control.postgres"
root-slot = "access-control"

[features]
default = []
postgres-acceptance = []

[dependencies]
lenso-access-control-core = { version = "0.1.0", path = "../lenso-access-control-core" }
futures.workspace = true
lenso.workspace = true
lenso-auth-sdk.workspace = true
lenso-capability-access-control = { version = "0.2.1", path = "../lenso-capability-access-control" }
lenso-capability-access-control-admin = { version = "0.2.1", path = "../lenso-capability-access-control-admin" }
lenso-capability-access-control-directory = { version = "0.2.1", path = "../lenso-capability-access-control-directory" }
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan.workspace = true
tokio.workspace = true
url = "2.5"

[lints]
workspace = true

[dev-dependencies.lenso-access-control-core]
version = "0.1.0"
path = "../lenso-access-control-core"
features = ["conformance"]
