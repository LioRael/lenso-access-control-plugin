[workspace]
resolver = "2"
members = [
    "crates/lenso-access-control-workers-smoke",
    "crates/lenso-access-control-d1-plugin",
    "crates/lenso-access-control-core",
    "crates/lenso-access-control-agent-tools-plugin",
    "crates/lenso-capability-access-control",
    "crates/lenso-capability-access-control-admin",
    "crates/lenso-capability-access-control-directory",
    "crates/lenso-access-control-postgres-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = true
repository = "https://github.com/LioRael/lenso-access-control-plugin"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
lenso = { version = "0.5.17" }
lenso-app-plan = { version = "0.4.1" }
lenso-auth-sdk = { version = "0.2.3" }
lenso-capability-agent-tool-provider = { version = "0.2.2" }
lenso-capability-secrets = { version = "0.1.4" }
lenso-contract-runtime = { version = "0.2.0" }
lenso-kernel = { version = "0.3.6" }
lenso-native-adapter = { version = "0.3.14" }
lenso-plugin-authoring = { version = "0.2.0" }
lenso-postgres-kit = { version = "0.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.52", features = ["macros", "rt"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
