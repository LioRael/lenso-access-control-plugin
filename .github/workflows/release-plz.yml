name: Release-plz

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only release qualification mode
        required: true
        default: dry-run
        type: choice
        options: [dry-run]
      source_sha:
        description: Full SHA already landed on main
        required: true
        type: string
      release_set:
        description: Exact JSON array of packages to qualify
        required: true
        type: string
      candidate_run_id:
        description: Candidate CI run ID that proved this SHA
        required: true
        type: string
      candidate_attempt:
        description: Candidate CI run attempt
        required: true
        type: string

permissions: {}

concurrency:
  group: access-control-crates-release
  cancel-in-progress: false

jobs:
  dry-run:
    name: Release dry-run
    if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'dry-run' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout landed main and verify its immutable SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify landed SHA and candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          RELEASE_SET: ${{ inputs.release_set }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]]
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<<"$RELEASE_SET" >/dev/null
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          [[ "$(jq -r .head_sha <<<"$run")" == "$SOURCE_SHA" ]]
          [[ "$(jq -r .event <<<"$run")" == "push" ]]
          [[ "$(jq -r .head_branch <<<"$run")" == delta/verify/* ]]
          [[ "$(jq -r .run_attempt <<<"$run")" == "$CANDIDATE_ATTEMPT" ]]
          [[ "$(jq -r .conclusion <<<"$run")" == "success" ]]
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs?per_page=100")"
          jq -e '.jobs[] | select(.name == "quality") | .conclusion == "success"' <<<"$jobs" >/dev/null
          jq -e '.jobs[] | select(.name == "workers") | .conclusion == "success"' <<<"$jobs" >/dev/null
          echo "Qualified release set: $RELEASE_SET"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
      - name: Validate without publishing, tagging, or opening a PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          config: release-plz.toml
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
